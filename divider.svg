<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" width="800" height="44" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="mini">
      <g stroke="#3a7d5c" stroke-width="1.5">
        <ellipse cx="0" cy="-6" rx="4" ry="6"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(288)"/>
        <circle r="3.5" fill="#ffd56b"/>
      </g>
    </g>
    <path id="sparkle" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8Z" fill="#ffd56b" stroke="#3a7d5c" stroke-width="1.2"/>
    <style>
      .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 8s linear infinite; }
      .twinkle { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 2.4s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes twinkle { 0%,100% { transform: scale(.4); opacity: .4 } 50% { transform: scale(1.1); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- enredadera -->
  <path d="M40 22 Q80 12 120 22 T200 22 T280 22 T360 22 T440 22 T520 22 T600 22 T680 22 T760 22"
        fill="none" stroke="#3a7d5c" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#8fdcab" stroke="#3a7d5c" stroke-width="1.5">
    <ellipse cx="90" cy="14" rx="7" ry="3.5" transform="rotate(-25 90 14)"/>
    <ellipse cx="170" cy="30" rx="7" ry="3.5" transform="rotate(25 170 30)"/>
    <ellipse cx="330" cy="30" rx="7" ry="3.5" transform="rotate(25 330 30)"/>
    <ellipse cx="470" cy="14" rx="7" ry="3.5" transform="rotate(-25 470 14)"/>
    <ellipse cx="630" cy="30" rx="7" ry="3.5" transform="rotate(25 630 30)"/>
    <ellipse cx="710" cy="14" rx="7" ry="3.5" transform="rotate(-25 710 14)"/>
  </g>

  <!-- flores que giran despacito -->
  <g transform="translate(240 22)"><use href="#mini" class="spin" fill="#ffffff"/></g>
  <g transform="translate(400 22) scale(1.4)"><use href="#mini" class="spin" fill="#ffb3d1"/></g>
  <g transform="translate(560 22)"><use href="#mini" class="spin" fill="#ffffff"/></g>

  <!-- brillitos -->
  <g transform="translate(40 22)"><use href="#sparkle" class="twinkle"/></g>
  <g transform="translate(760 22)"><use href="#sparkle" class="twinkle" style="animation-delay:-1.2s"/></g>
</svg>
