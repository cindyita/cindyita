<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="2" fill="#ffc9de"/>
    </pattern>

    <!-- Margarita: el tallo nace en (0,0); los pétalos toman el color del <use> -->
    <g id="daisy">
      <path d="M0 0 C -5 -25, 5 -45, 0 -70" stroke="#3a7d5c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0 -30 C 10 -42, 22 -40, 26 -33 C 16 -26, 7 -26, 0 -30Z" fill="#8fdcab" stroke="#3a7d5c" stroke-width="2" stroke-linejoin="round"/>
      <g transform="translate(0,-70)" stroke="#3a7d5c" stroke-width="2">
        <ellipse cx="0" cy="-11" rx="7" ry="11"/>
        <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(60)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(120)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(180)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(240)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(300)"/>
        <circle r="7" fill="#ffd56b"/>
      </g>
    </g>

    <path id="sparkle" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5Z" fill="#ffd56b" stroke="#3a7d5c" stroke-width="1.5" stroke-linejoin="round"/>
    <path id="heart" d="M0 4 C0 -2 -8 -2 -8 4 C-8 9 0 12 0 15 C0 12 8 9 8 4 C8 -2 0 -2 0 4Z" fill="#ff7eb6" stroke="#3a7d5c" stroke-width="1.5"/>

    <style>
      .anim { transform-box: fill-box; }
      .sway  { transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .twinkle { transform-origin: 50% 50%; animation: twinkle 2.4s ease-in-out infinite; }
      .rise { animation: rise 6s ease-in infinite; }
      .wiggle { transform-origin: 50% 50%; animation: wiggle 2.6s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .name { font-family: "Trebuchet MS", Verdana, "Segoe UI", sans-serif; font-weight: 700; font-size: 66px; letter-spacing: 2px;
              fill: #ff5fa2; stroke: #3a7d5c; stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; }
      .mono { font-family: "Courier New", Courier, monospace; font-size: 16px; fill: #3a7d5c; }
      @keyframes sway { 0%,100% { transform: rotate(-6deg) } 50% { transform: rotate(6deg) } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
      @keyframes twinkle { 0%,100% { transform: scale(.4) rotate(0deg); opacity: .4 } 50% { transform: scale(1.1) rotate(45deg); opacity: 1 } }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-150px); opacity: 0 } }
      @keyframes wiggle { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="260" fill="#ffe8f1"/>
  <rect width="800" height="260" fill="url(#dots)"/>

  <!-- Corazones que suben -->
  <g transform="translate(700 225)"><use href="#heart" class="anim rise"/></g>
  <g transform="translate(110 230)"><use href="#heart" class="anim rise" style="animation-delay:-2s"/></g>
  <g transform="translate(765 235)"><use href="#heart" class="anim rise" style="animation-delay:-4s"/></g>
  <g transform="translate(40 225)"><use href="#heart" class="anim rise" style="animation-delay:-3s"/></g>

  <!-- Detalles tech -->
  <g transform="translate(725 110)">
    <text class="anim wiggle mono" text-anchor="middle" style="font-size:24px;font-weight:700">&lt;/&gt;</text>
  </g>
  <g transform="translate(75 105)">
    <text class="anim wiggle mono" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#ff5fa2;animation-delay:-1.3s">{ }</text>
  </g>

  <!-- Brillitos -->
  <g transform="translate(115 45)"><use href="#sparkle" class="anim twinkle"/></g>
  <g transform="translate(690 40)"><use href="#sparkle" class="anim twinkle" style="animation-delay:-.8s"/></g>
  <g transform="translate(660 205)"><use href="#sparkle" class="anim twinkle" style="animation-delay:-1.6s"/></g>
  <g transform="translate(140 200)"><use href="#sparkle" class="anim twinkle" style="animation-delay:-1.2s"/></g>

  <!-- Colina -->
  <path d="M0 240 Q200 222 400 240 T800 238 V260 H0Z" fill="#bfeccf" stroke="#3a7d5c" stroke-width="2"/>

  <!-- Ventana con el nombre -->
  <g class="float">
    <rect x="156" y="41" width="500" height="170" rx="18" fill="#3a7d5c"/>
    <rect x="150" y="35" width="500" height="170" rx="18" fill="#fffafc" stroke="#3a7d5c" stroke-width="3"/>
    <path d="M150 65 V53 Q150 35 168 35 H632 Q650 35 650 53 V65Z" fill="#bfeccf" stroke="#3a7d5c" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="174" cy="50" r="6" fill="#ff7eb6" stroke="#3a7d5c" stroke-width="2"/>
    <circle cx="194" cy="50" r="6" fill="#ffd56b" stroke="#3a7d5c" stroke-width="2"/>
    <circle cx="214" cy="50" r="6" fill="#8fdcab" stroke="#3a7d5c" stroke-width="2"/>
    <text x="400" y="55" text-anchor="middle" class="mono" style="font-size:14px">jardín.js</text>

    <text x="400" y="135" text-anchor="middle" class="name">cindyita</text>

    <text x="200" y="182" class="mono">$ npm run bloom</text>
    <rect class="cursor" x="349" y="168" width="9" height="17" fill="#ff7eb6"/>
  </g>

  <!-- Flores izquierda -->
  <g transform="translate(30 250) scale(.8)"><use href="#daisy" class="anim sway" fill="#ffffff" style="animation-delay:-1s"/></g>
  <g transform="translate(70 252)"><use href="#daisy" class="anim sway" fill="#ffb3d1"/></g>
  <g transform="translate(115 250) scale(.7)"><use href="#daisy" class="anim sway" fill="#ffffff" style="animation-delay:-2s"/></g>

  <!-- Flores derecha -->
  <g transform="translate(690 250) scale(.7)"><use href="#daisy" class="anim sway" fill="#ffffff" style="animation-delay:-1.5s"/></g>
  <g transform="translate(730 252)"><use href="#daisy" class="anim sway" fill="#ffb3d1" style="animation-delay:-.5s"/></g>
  <g transform="translate(772 250) scale(.8)"><use href="#daisy" class="anim sway" fill="#ffffff" style="animation-delay:-2.5s"/></g>
</svg>
